        body { font-family: 'Inter', sans-serif; line-height: 1.6; color: #2D2D2D; background: #F5F5F5; }

        p { font-size: 16px; margin-bottom: 15px; }
        section { padding: 80px 0; }

        .hero p { color: #F5F5F5; font-size: 18px; }

        .solution { background: #1A1A2E; color: #F5F5F5; }

        .value-item { background: #FFF; padding: 20px; border-left: 4px solid #10B981; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        .final-price .savings { font-size: 14px; color: #10B981; font-weight: 600; }

        .testimonial-author { font-weight: 700; color: #FF6B35; }
        .testimonial-context { font-size: 12px; color: rgba(255,255,255,0.7); }

        .guarantee h2 { color: #F5F5F5; }
        .guarantee p { color: rgba(255,255,255,0.95); }
        .guarantee-icon { font-size: 64px; margin-bottom: 20px; }
